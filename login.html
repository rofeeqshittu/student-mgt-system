<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduVexa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern-styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00a693 0%, #ff9500 100%);
            padding: 2rem;
        }
        
        .auth-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        
        .auth-logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00a693 0%, #ff9500 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        
        .auth-logo-text {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00a693 0%, #ff9500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .auth-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: #171717;
            margin-bottom: 0.5rem;
        }
        
        .auth-subtitle {
            color: #525252;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .auth-form-group {
            position: relative;
        }
        
        .auth-form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #404040;
            margin-bottom: 0.5rem;
        }
        
        .auth-form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            padding-left: 2.75rem;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #fafafa;
        }
        
        .auth-form-input:focus {
            outline: none;
            border-color: #00a693;
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 166, 147, 0.1);
        }
        
        .auth-form-icon {
            position: absolute;
            left: 0.875rem;
            top: 2.375rem;
            color: #a3a3a3;
            font-size: 1rem;
            width: 1rem;
            height: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-form-toggle {
            position: absolute;
            right: 0.875rem;
            top: 2.375rem;
            color: #a3a3a3;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s ease;
            width: 1rem;
            height: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-form-toggle:hover {
            color: #00a693;
        }
        
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .auth-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .auth-checkbox input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            border-radius: 4px;
            border: 2px solid #d4d4d4;
            background: white;
            cursor: pointer;
        }
        
        .auth-checkbox input[type="checkbox"]:checked {
            background: #00a693;
            border-color: #00a693;
        }
        
        .auth-checkbox label {
            font-size: 0.875rem;
            color: #525252;
            cursor: pointer;
        }
        
        .auth-forgot-link {
            font-size: 0.875rem;
            color: #00a693;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .auth-forgot-link:hover {
            color: #e6850e;
            text-decoration: underline;
        }
        
        .auth-submit-btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, #00a693 0%, #ff9500 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 166, 147, 0.4);
        }
        
        .auth-submit-btn:active {
            transform: translateY(0);
        }
        
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }
        
        .auth-divider span {
            padding: 0 1rem;
            color: #a3a3a3;
            font-size: 0.875rem;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 2rem;
        }
        
        .auth-footer-text {
            color: #525252;
            font-size: 0.875rem;
        }
        
        .auth-footer-link {
            color: #00a693;
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.25rem;
        }
        
        .auth-footer-link:hover {
            text-decoration: underline;
        }
        
        .loading-spinner {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .success-message {
            color: #22c55e;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        @media (max-width: 640px) {
            .auth-container {
                padding: 1rem;
            }
            
            .auth-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <div class="auth-logo-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div class="auth-logo-text">EduVexa</div>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your account to continue managing students and courses</p>
            </div>
            
            <form class="auth-form" id="login-form">
                <div class="auth-form-group">
                    <label for="email" class="auth-form-label">Email Address</label>
                    <div style="position: relative;">
                        <i class="fas fa-envelope auth-form-icon"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="auth-form-input" 
                            placeholder="Enter your email address"
                            required
                        >
                    </div>
                    <div class="error-message" id="email-error"></div>
                </div>
                
                <div class="auth-form-group">
                    <label for="password" class="auth-form-label">Password</label>
                    <div style="position: relative;">
                        <i class="fas fa-lock auth-form-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="auth-form-input" 
                            placeholder="Enter your password"
                            required
                        >
                        <i class="fas fa-eye auth-form-toggle" id="password-toggle" onclick="togglePassword()"></i>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <div class="auth-options">
                    <div class="auth-checkbox">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="auth-forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="auth-submit-btn" id="login-btn">
                    <span id="login-text">Sign In</span>
                    <div class="loading-spinner" id="login-spinner" style="display: none;"></div>
                </button>
                
                <div class="success-message" id="login-success"></div>
                <div class="error-message" id="login-error"></div>
            </form>
            
            <div class="auth-divider">
                <span>or continue with</span>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-outline" style="flex: 1;" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i>
                    Google
                </button>
                <button class="btn btn-outline" style="flex: 1;" onclick="loginWithMicrosoft()">
                    <i class="fab fa-microsoft"></i>
                    Microsoft
                </button>
            </div>
            
            <div class="auth-footer">
                <p class="auth-footer-text">
                    Don't have an account?
                    <a href="register.html" class="auth-footer-link">Sign up here</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // Form validation and submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset previous errors
            clearErrors();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Validate inputs
            let isValid = true;
            
            if (!email) {
                showError('email-error', 'Email address is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('email-error', 'Please enter a valid email address');
                isValid = false;
            }
            
            if (!password) {
                showError('password-error', 'Password is required');
                isValid = false;
            } else if (password.length < 6) {
                showError('password-error', 'Password must be at least 6 characters');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show loading state
            showLoading(true);
            
            // Simulate API call
            setTimeout(() => {
                // For demo purposes, accept any email/password combination
                if (email && password) {
                    showSuccess('login-success', 'Login successful! Redirecting...');
                    setTimeout(() => {
                        // window.location.href = 'dashboard.html';
                        console.log('Would redirect to dashboard.html');
                    }, 1500);
                } else {
                    showError('login-error', 'Invalid email or password. Please try again.');
                }
                showLoading(false);
            }, 2000);
        });
        
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
        
        // Utility functions
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        function showSuccess(elementId, message) {
            const successElement = document.getElementById(elementId);
            successElement.textContent = message;
            successElement.style.display = 'block';
        }
        
        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message, .success-message');
            errorElements.forEach(element => {
                element.style.display = 'none';
                element.textContent = '';
            });
        }
        
        function showLoading(isLoading) {
            const button = document.getElementById('login-btn');
            const text = document.getElementById('login-text');
            const spinner = document.getElementById('login-spinner');
            
            if (isLoading) {
                button.disabled = true;
                text.textContent = 'Signing In...';
                spinner.style.display = 'block';
            } else {
                button.disabled = false;
                text.textContent = 'Sign In';
                spinner.style.display = 'none';
            }
        }
        
        // Social login functions (placeholder)
        function loginWithGoogle() {
            alert('Google login integration would be implemented here');
        }
        
        function loginWithMicrosoft() {
            alert('Microsoft login integration would be implemented here');
        }
        
        // Auto-focus on first input
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
