<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-green: #00A693;
            --brand-yellow: #FFB300;
        }
        .bg-brand-green { background-color: var(--brand-green) !important; }
        .text-brand-green { color: var(--brand-green) !important; }
        .bg-brand-yellow { background-color: var(--brand-yellow) !important; }
        .text-brand-yellow { color: var(--brand-yellow) !important; }
        .border-brand-green { border-color: var(--brand-green) !important; }
        .border-brand-yellow { border-color: var(--brand-yellow) !important; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-brand-green text-white py-4 shadow">
        <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
            <h1 class="mb-3 mb-md-0 fw-bold">Add Course</h1>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a href="index.html" class="nav-link text-white">Home</a></li>
                    <li class="nav-item"><a href="courses.html" class="nav-link text-white">Courses</a></li>
                    <li class="nav-item"><a href="skills.html" class="nav-link text-white">Skills</a></li>
                    <li class="nav-item"><a href="add_student.html" class="nav-link text-white">Add Student</a></li>
                    <li class="nav-item"><a href="add_course.html" class="nav-link text-white">Add Course</a></li>
                    <li class="nav-item"><a href="add_skill.html" class="nav-link text-white">Add Skill</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container py-5 flex-grow-1">
        <section class="bg-white rounded-4 shadow p-5 mx-auto" style="max-width: 500px; border-left: 8px solid var(--brand-yellow);">
            <h2 class="text-brand-yellow fw-bold mb-4">Add a New Course</h2>
            <form id="course-form" action="/add-course" method="POST" class="row g-3">
                <div class="col-12">
                    <label for="course_name" class="form-label">Course Name*</label>
                    <input type="text" id="course_name" name="course_name" required class="form-control">
                </div>
                <div class="col-12">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" id="description" name="description" class="form-control">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn bg-brand-green text-white w-100 fw-bold">Add Course</button>
                </div>
            </form>
            <div id="response-message" class="mt-3 text-brand-green"></div>
        </section>
    </main>
    <footer class="bg-brand-green text-white text-center py-4 mt-5 shadow">
        <p class="mb-0 fw-medium">&copy; 2024 Student Management System. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
